# Inventario = lista de servidores que Ansible va a configurar.
# Destino: el contenedor CentOS 7 levantado con docker compose.

# [lemp] es un grupo; site.yml apunta a este grupo con "hosts: lemp"
[lemp]
# lemp-centos7 = nombre del contenedor (container_name en docker-compose.yml).
# ansible_connection=community.docker.docker: en vez de SSH, Ansible entra con
# "docker exec", así no hacen falta llaves ni servidor SSH en el contenedor.
lemp-centos7 ansible_connection=community.docker.docker
