# Configuración de Ansible para este proyecto (se lee automáticamente
# si se ejecuta ansible-playbook desde esta carpeta).

# Sección de opciones generales
[defaults]
# Inventario por defecto: el contenedor Docker local (se cambia con -i)
inventory = inventories/docker.ini
# Carpeta donde Ansible busca los roles
roles_path = roles
# No pedir confirmación de la huella SSH la primera vez (útil en laboratorio)
host_key_checking = False
# No crear archivos .retry cuando falla un host
retry_files_enabled = False
# Salida en formato YAML: más legible que el JSON por defecto
stdout_callback = yaml
# Python del destino: el 2.7 de CentOS 7, que es el que tiene los bindings de yum
interpreter_python = /usr/bin/python
