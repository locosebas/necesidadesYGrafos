* { box-sizing:border-box; }

.fila { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
input { flex:1; min-width:200px; padding:10px 12px; font-size:1rem; border:1px solid var(--borde); border-radius:8px; background:var(--tarjeta); color:var(--texto); }
.cuenta { color:var(--gris); font-size:.9rem; }
.leyenda { display:flex; gap:8px; flex-wrap:wrap; }
.leyenda button { font:inherit; font-size:.85rem; cursor:pointer; border-radius:999px; padding:5px 12px; border:1.5px solid; display:flex; gap:6px; align-items:center; }
.leyenda button.apagado { opacity:.35; text-decoration:line-through; }
.leyenda b { font-weight:700; }
.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:16px; margin-top:8px; }
section { background:var(--tarjeta); border:1px solid var(--borde); border-top:4px solid var(--azul); border-radius:10px; padding:14px 16px; }
section.oculta { display:none; }
h2 { font-size:1.05rem; color:var(--oscuro); margin:0 0 6px; display:flex; justify-content:space-between; gap:8px; }
h2 .n { color:var(--azul); margin-right:6px; }
h2 .total { color:var(--gris); font-weight:400; font-size:.85rem; white-space:nowrap; }
.barrita { display:flex; height:6px; border-radius:3px; overflow:hidden; margin-bottom:10px; background:var(--n-bg); }
.barrita span { display:block; height:100%; }
ul { list-style:none; margin:0; padding:0; display:flex; flex-wrap:wrap; gap:6px; }
li { border:1.5px solid; border-radius:999px; padding:4px 10px; font-size:.9rem; }
li[title]:not([title=""]) { cursor:help; }
li.oculta { display:none; }
li.match { outline:2px solid var(--azul); outline-offset:1px; }

const NIVELES = { b:"🔵 Senior", g:"🟢 Sólido", y:"🟡 Intermedio", r:"🔴 Novato", n:"⬜ No visto" };
const ORDEN = "bgyrn";
const activos = new Set(ORDEN);

const grid = document.getElementById("grid");
const cuenta = document.getElementById("cuenta");
const leyenda = document.getElementById("leyenda");
const conteo = Object.fromEntries([...ORDEN].map(k => [k, 0]));
DATOS.forEach(([, hs]) => hs.forEach(([, k]) => conteo[k]++));
const total = Object.values(conteo).reduce((a, b) => a + b, 0);

for (const k of ORDEN) {
  if (!conteo[k]) continue;
  const b = document.createElement("button");
  b.className = k;
  b.innerHTML = `<span></span><b>${conteo[k]}</b>`;
  b.firstChild.textContent = NIVELES[k];
  b.onclick = () => { activos.has(k) ? activos.delete(k) : activos.add(k); b.classList.toggle("apagado", !activos.has(k)); filtrar(); };
  leyenda.append(b);
}

DATOS.forEach(([cat, hs], i) => {
  const sec = document.createElement("section");
  const h2 = document.createElement("h2");
  h2.innerHTML = `<span><span class="n">${i + 1}.</span></span><span class="total">${hs.length}</span>`;
  h2.firstChild.append(cat);
  const barra = document.createElement("div");
  barra.className = "barrita";
  for (const k of ORDEN) {
    const n = hs.filter(h => h[1] === k).length;
    if (n) { const s = document.createElement("span"); s.className = k; s.style.width = (100 * n / hs.length) + "%"; barra.append(s); }
  }
  const ul = document.createElement("ul");
  hs.forEach(([nombre, k, nota]) => {
    const li = document.createElement("li");
    li.className = k; li.dataset.nivel = k;
    li.textContent = nombre;
    li.title = NIVELES[k] + (nota ? " — " + nota : "");
    ul.append(li);
  });
  sec.append(h2, barra, ul);
  grid.append(sec);
});

const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
function filtrar() {
  const q = norm(document.getElementById("q").value.trim());
  let visibles = 0;
  grid.querySelectorAll("section").forEach(sec => {
    const catCoincide = q && norm(sec.querySelector("h2").textContent).includes(q);
    let n = 0;
    sec.querySelectorAll("li").forEach(li => {
      const texto = !q || catCoincide || norm(li.textContent).includes(q);
      const ok = texto && activos.has(li.dataset.nivel);
      li.classList.toggle("oculta", !ok);
      li.classList.toggle("match", !!q && !catCoincide && ok);
      if (ok) n++;
    });
    sec.classList.toggle("oculta", n === 0);
    visibles += n;
  });
  cuenta.textContent = visibles === total ? `${total} herramientas · ${DATOS.length} categorías` : `${visibles} de ${total} herramientas`;
}
document.getElementById("q").addEventListener("input", filtrar);
filtrar();
